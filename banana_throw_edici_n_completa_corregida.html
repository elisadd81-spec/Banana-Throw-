<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banana Throw - Sitio Oficial: Arena, Guía, Noticias, Privacidad y Contacto</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#bfe9ff;
  --ink:#2b1b0e;
  --panel:#fff8d9;
  --card:#fffdf2;
  --ov:rgba(255,244,194,.97);
  --accent:#ff8a3d;
  --gold:#ffd93b;
  --green:#8fd13f;
  --muted:#6d5239;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10222e;--ink:#fff1c0;--panel:#3a2d13;--card:#2b210d;--ov:rgba(28,20,6,.97);--muted:#d9c28f;
  }
}
:root[data-theme="dark"]{
  --bg:#10222e;--ink:#fff1c0;--panel:#3a2d13;--card:#2b210d;--ov:rgba(28,20,6,.97);--muted:#d9c28f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(circle at top,#d8f3ff,var(--bg));
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;user-select:none;-webkit-user-select:none;
  font-family:"Nunito",sans-serif;
}
#g{
  position:relative;height:100%;max-height:175vw;aspect-ratio:3/5;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
  border-radius:18px;overflow:hidden;border:4px solid var(--ink);
}
@media(max-width:520px){
  #g{width:100%;height:100%;max-height:none;aspect-ratio:auto;border:none;border-radius:0}
}
canvas{width:100%;height:100%;display:block;touch-action:none}
#u{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:12px 14px 24px;
  color:var(--ink);background:var(--ov);text-align:center;
  scrollbar-width:thin;
}
button{
  font-family:"Nunito",sans-serif;font-weight:900;cursor:pointer;
  border:2.5px solid var(--ink);border-radius:12px;
  background:var(--card);color:var(--ink);
  padding:6px 10px;box-shadow:0 2px 0 var(--ink);
  transition:transform .08s ease,background .15s ease;
}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{background:var(--green);color:#1f2c0b}
button.go{
  width:100%;font-family:"Bangers",cursive;font-size:1.45em;letter-spacing:.04em;
  background:var(--green);color:#1f2c0b;padding:10px 14px;
  border-radius:16px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
}
.tb{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0}
.titleFont{font-family:"Bangers",cursive;letter-spacing:.04em}
h1,h2,h3{
  font-family:"Bangers",cursive;letter-spacing:.04em;
  margin:.15em 0;color:#ffb800;
  -webkit-text-stroke:.045em var(--ink);paint-order:stroke fill;
}
h1{font-size:2.4em;line-height:1}
h2{font-size:1.75em;line-height:1.1}
h3{font-size:1.35em;color:#ff8a3d}
p{margin:.35em 0;font-size:.92em;line-height:1.35}

/* Navegación superior persistente dentro del menú */
.topNav{
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  position:sticky;top:0;z-index:20;
  background:var(--panel);padding:6px;border-radius:14px;
  border:3px solid var(--ink);margin-bottom:10px;
  box-shadow:0 3px 0 var(--ink);
}
.topNav button{
  font-family:"Bangers",cursive;font-size:.84em;letter-spacing:.03em;
  padding:5px 2px;border-radius:10px;border:2px solid var(--ink);
  background:var(--card);color:var(--ink);box-shadow:none;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.topNav button.active{
  background:var(--gold);color:#2b1b0e;transform:translateY(-1px);
  box-shadow:0 2px 0 #2b1b0e;
}
.siteFooter{
  margin-top:14px;padding:10px;border-radius:14px;
  border:2.5px solid var(--ink);background:var(--panel);
  font-size:.78em;text-align:center;line-height:1.4;
}
.siteFooter a,.inlineLink{
  color:#d95314;font-weight:900;text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;box-shadow:none;font-family:"Nunito",sans-serif;font-size:1em;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .siteFooter a,
  :root:not([data-theme="light"]) .inlineLink{color:#ffae42;}
}
:root[data-theme="dark"] .siteFooter a,
:root[data-theme="dark"] .inlineLink{color:#ffae42;}
.legalBox{
  background:var(--panel);border:2px solid var(--ink);border-radius:12px;
  padding:8px 10px;margin:6px 0;font-size:.82em;line-height:1.4;
}
.formField{width:100%;margin:4px 0 8px;padding:7px 9px;border-radius:10px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font-family:"Nunito",sans-serif;font-size:.86em;font-weight:700}
.card{
  background:var(--card);border:3px solid var(--ink);border-radius:16px;
  padding:10px 12px;margin:8px 0;text-align:left;
  box-shadow:0 3px 0 var(--ink);
}
.it{
  display:flex;justify-content:space-between;align-items:center;gap:.55em;
  text-align:left;border:3px solid var(--ink);border-radius:14px;
  padding:.4em .6em;margin:.45em 0;background:var(--panel);
}
.it small{display:block;font-size:.78em;color:var(--muted);line-height:1.25;font-weight:700}
.sw{display:inline-block;width:1.25em;height:1.25em;border:3px solid var(--ink);border-radius:50%;vertical-align:middle;margin-right:.35em}
.it.barItem{background:linear-gradient(135deg,#fff0ad,#ffc45e);border-color:#713b19;box-shadow:0 3px 0 #8b4b20}
.it.barItem button{background:#ff963d;color:#2b1b0e;border-color:#713b19;white-space:nowrap}

.avTabs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:.4em 0}
.avTabs button{font-size:.82em;padding:.24em .48em}
.avItem{background:linear-gradient(135deg,#fffdf0,#fff0bb)}
.rarity{font-weight:900}

.heroBanner{
  background:linear-gradient(135deg,#ffd93b 0%,#ff9a3c 100%);
  border:3px solid #2b1b0e;border-radius:18px;padding:12px;
  color:#2b1b0e;margin-bottom:8px;box-shadow:0 4px 0 #2b1b0e;
}
.heroBanner h1{font-size:2.3em;margin:0;color:#fff;-webkit-text-stroke:.05em #2b1b0e}
.badge{
  display:inline-block;background:#2b1b0e;color:#ffd93b;
  font-family:"Bangers",cursive;font-size:.82em;padding:2px 9px;
  border-radius:999px;letter-spacing:.05em;margin-bottom:4px;
}
.statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.statBox{
  background:var(--panel);border:2.5px solid var(--ink);border-radius:12px;
  padding:6px 4px;text-align:center;
}
.statBox strong{display:block;font-family:"Bangers",cursive;font-size:1.3em;color:#ff7b29}
.statBox span{font-size:.72em;font-weight:800;text-transform:uppercase}

.guideCard{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--card);border:3px solid var(--ink);border-radius:15px;
  padding:9px;margin:7px 0;text-align:left;
}
.guideArt{
  flex:0 0 64px;height:64px;border-radius:12px;border:2.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;background:#fff4c2;
}
.tagRow{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{
  font-size:.72em;font-weight:800;padding:2px 7px;border-radius:8px;
  border:1.5px solid var(--ink);background:var(--panel);
}
.newsCard{
  background:var(--card);border:3px solid var(--ink);border-radius:16px;
  padding:10px 12px;margin:8px 0;text-align:left;position:relative;
}
.newsDate{
  font-size:.74em;font-weight:900;color:#ff6e26;text-transform:uppercase;
}
.illusBox{
  width:100%;border-radius:12px;border:2.5px solid var(--ink);
  overflow:hidden;margin:6px 0;background:#e4f7ff;
}
.cred{margin:1em 0 .3em;padding:.65em;border:3px dashed var(--ink);border-radius:14px;background:var(--panel);font-size:.82em}
.toastMsg{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:#2b1b0e;color:#ffd93b;padding:8px 16px;border-radius:999px;
  font-family:"Bangers",cursive;font-size:1.05em;z-index:99;
  border:2px solid #ffd93b;box-shadow:0 4px 12px rgba(0,0,0,.4);
}
</style>
</head>

function cleanSave(raw){
  const d=freshSave(),v=raw&&typeof raw==='object'?raw:{};
  d.storageConsent=typeof v.storageConsent==='boolean'?v.storageConsent:true;
  d.b=Math.max(0,Math.floor(Number(v.b)||0));
  for(const [k,,,,mxl] of UP)d.u[k]=Math.max(0,Math.min(mxl,Math.floor(Number(v.u&&v.u[k])||0)));
  d.w=Array.isArray(v.w)?[...new Set(v.w.map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<WP.length))]:[0];
  if(!d.w.includes(0))d.w.unshift(0);
  d.ws=d.w.includes(Number(v.ws))?Number(v.ws):0;
  d.k=Array.isArray(v.k)?[...new Set(v.k.map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<SK.length))]:[0];
  if(!d.k.includes(0))d.k.unshift(0);
  d.ks=d.k.includes(Number(v.ks))?Number(v.ks):0;
  d.best=Math.max(0,Math.floor(Number(v.best)||0));
  d.bar=Math.max(0,Math.min(5,Math.floor(Number(v.bar)||0)));
  const avatar=v.avatar&&typeof v.avatar==='object'?v.avatar:{};
  const validAvatar=new Set(AVATAR_ITEMS.map(it=>it.id));
  d.avatar={owned:[...new Set([...AVATAR_START,...(Array.isArray(avatar.owned)?avatar.owned.filter(id=>validAvatar.has(id)):[])])],equip:{}};
  for(const cat of AVATAR_CATEGORIES){
    const chosen=avatar.equip&&avatar.equip[cat.key];
    const starter=AVATAR_START.find(id=>id.startsWith(cat.key+'_'))||null;
    d.avatar.equip[cat.key]=d.avatar.owned.includes(chosen)?chosen:starter;
  }
  const savedWorlds=Array.isArray(v.worldOrder)?v.worldOrder.filter(w=>Object.prototype.hasOwnProperty.call(WORLDS,w)):[];
  d.worldOrder=[...WORLD_BASE,...savedWorlds.slice(4)];
  if(v.run&&typeof v.run==='object'&&v.run.active&&Array.isArray(v.run.gs))d.run=v.run;
  if(v.shop&&typeof v.shop==='object'&&Number(v.shop.wave)>0){
    d.shop={wave:Math.max(1,Math.floor(Number(v.shop.wave)||1)),bh:Math.max(0,Math.min(12,Math.floor(Number(v.shop.bh)||0))),lives:Math.max(1,Math.floor(Number(v.shop.lives)||5))};
  }
  return d;
}
function decodeSave(raw){
  try{
    const o=JSON.parse(raw),data=o&&o.data?o.data:o;
    if(!data||typeof data!=='object'||(!('b'in data)&&!('w'in data)))return null;
    return{data:cleanSave(data),savedAt:Number(o.savedAt)||0,version:Number(o.version)||1};
  }catch(e){return null;}
}

function runSnapshot(){
  if(st!=='play')return null;
  return{active:true,wave,left,sp,boss,bh,lives,gs:gs.filter(g=>!g.dead).map(g=>({...g})),bm:bm.map(b=>({x0:b.x0,y0:b.y0,ux:b.ux,uy:b.uy,a:b.a,b:b.b,t:b.t,dur:b.dur,x:b.x,y:b.y,w:b.w,ex:!!b.ex,specialUsed:!!b.specialUsed,pi:!!b.pi}))};
}
function openSaveDB(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    if(!('indexedDB'in window)){reject(new Error('IndexedDB no disponible'));return;}
    const req=indexedDB.open(SAVE_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('saves'))db.createObjectStore('saves');};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Error DB'));
  });
  return dbPromise;
}
function writeDB(payload){
  openSaveDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction('saves','readwrite');
    tx.objectStore('saves').put(payload,'main');
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  })).catch(()=>{});
}

/* --- FUNCIÓN UNIFICADA DE GUARDADO --- */
function sv(notify=false){
  S.storageConsent=!!storageConsent;
  S.run=runSnapshot();
  if(st==='shop')S.shop={wave,bh,lives};else if(st==='play'||st==='over')S.shop=null;
  const now=Date.now(),payload=JSON.stringify({version:SAVE_VERSION,savedAt:now,data:S});
  latestSaveAt=now;
  if(!storageConsent){
    writeWindowNameSave(payload);
    if(notify)showToast('💾 Guardado temporal de sesión (sin persistencia local)');
    return;
  }
  try{localStorage.setItem('bt1_recovery',payload);}catch(e){}
  try{localStorage.setItem('bt1_backup',payload);}catch(e){}
  try{localStorage.setItem('bt1',payload);}catch(e){}
  writeWindowNameSave(payload);
  writeDB(payload);
  if(notify&&(now-lastSaveToastAt>2500)){
    lastSaveToastAt=now;
    showToast('💾 Autoguardado activo');
  }
}

function restoreRun(){
  const r=S.run;
  if(r&&r.active){
    wave=Math.max(1,Number(r.wave)||1);currentWorld=worldForWave(wave);
    left=Math.max(0,Number(r.left)||0);sp=Math.max(0,Number(r.sp)||0);
    boss=Number(r.boss)||0;bh=Math.max(0,Math.min(bhMax(),Number(r.bh)||0));
    lives=Math.max(1,Number(r.lives)||mx());
    gs=Array.isArray(r.gs)?r.gs.map(g=>({...g})):[];
    bm=Array.isArray(r.bm)?r.bm.map(b=>({...b,h:new Map()})):[];
    fx=[];st='play';return true;
  }
  if(S.shop&&S.shop.wave){
    wave=S.shop.wave;currentWorld=worldForWave(wave);
    bh=S.shop.bh;lives=Math.min(mx(),S.shop.lives);
    gs=[];bm=[];fx=[];left=0;boss=0;st='shop';return true;
  }
  return false;
}
async function recoverIndexedDB(){
  if(!storageConsent)return;
  try{
    const db=await openSaveDB();
    const raw=await new Promise((resolve,reject)=>{
      const tx=db.transaction('saves','readonly'),req=tx.objectStore('saves').get('main');
      req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);
    });
    const candidate=raw&&decodeSave(raw);
    if(candidate&&candidate.savedAt>latestSaveAt&&!userTouched){
      S=candidate.data;latestSaveAt=candidate.savedAt;
      restoreRun();ui();
    }
  }catch(e){}
}

/* --- LÓGICA PRINCIPAL DEL JUEGO --- */
function deployBarricade(){if(bh<=0&&S.bar>0){S.bar--;bh=bhMax();pop(240,635,'¡BARRICADA!');}}
function worldForWave(w){
  const block=Math.max(0,Math.floor((w-1)/10));
  if(!Array.isArray(S.worldOrder))S.worldOrder=[...WORLD_BASE];
  while(S.worldOrder.length<=block){
    const last=S.worldOrder[S.worldOrder.length-1];
    const choices=Object.keys(WORLDS).filter(key=>key!==last);
    S.worldOrder.push(choices[Math.random()*choices.length|0]);
  }
  return S.worldOrder[block]||'park';
}
function nw(){
  const previous=currentWorld;
  wave++;currentWorld=worldForWave(wave);
  if(previous!==currentWorld)pop(240,160,'🌍 ¡'+WORLDS[currentWorld].name.toUpperCase()+'!');
  deployBarricade();
  left=Math.max(3,Math.round((5+wave*2)*WORLDS[currentWorld].n));
  sp=0;bm=[];
  boss=wave%10===0?2:(wave%5===0?1:0);
  if(boss)left++;
}
function pick(){
  if(currentWorld==='park'&&wave<=10){
    const p=['n','n','r'];
    if(wave>2)p.push('n','t');
    if(wave>4)p.push('e','s');
    if(wave>7)p.push('t','e','s','r');
    if(wave>4)p.push('G');
    if(wave>6)p.push('D');
    return p[Math.random()*p.length|0];
  }
  const a=['n'];
  if(wave>1)a.push('r','n');if(wave>2)a.push('t');if(wave>3)a.push('e','s');
  if(wave>5)a.push('t','e','s','r');if(wave>6)a.push('w');if(wave>8)a.push('f');
  if(wave>10)a.push('c');if(wave>12)a.push('m');if(wave>14)a.push('i');
  if(wave>16)a.push('q');if(wave>19)a.push('b');
  if(currentWorld==='lava')a.push('v','j','f','v','R','S','S');
  else if(currentWorld==='snow')a.push('h','y','q','h','I','W','W');
  else if(currentWorld==='space')a.push('u','o','x','u','Q','Z','Q');
  else a.push('G','D','G');
  return a[Math.random()*a.length|0];
}
function mk(k,p=0,lx=(Math.random()*2-1)*.85){
  const h=Math.ceil(GT[k].h*(1+wave*.1)*WORLDS[currentWorld].hp);
  gs.push({k,hp:h,mh:h,p,lx,sh:GT[k].sh||(k==='e'?3:(k==='q'||k==='z'?3:0)),j:2,a:0,sm:3,phaseT:1.5+Math.random()*2,state:'walk',anim:Math.random()*6,attackT:0,fade:0});
  if(GT[k].bs)pop(240,215,'👑 ¡'+GT[k].m.toUpperCase()+'!');
}
function defeat(g,q=P(g)){
  if(g.hp<=0&&!g.rewarded){
    g.state='defeated';g.fade=.72;g.rewarded=1;
    S.b+=GT[g.k].o;pop(q.x,q.y-30,'+'+GT[g.k].o+'🍌');
    sv();
  }
}
function hit(g,d,wi=S.ws,applySpecial=true,crit=false){
  const q=P(g),weapon=WP[wi]||WP[0];
  if(g.k==='o'&&g.dodge>0&&Math.random()<.58){pop(q.x,q.y-18,'✨ ¡INTANGIBLE!');return;}
  if(g.sh>0){g.sh--;pop(q.x,q.y,'¡CLANG!');return;}
  if(crit&&Math.random()<S.u.c*.04){d=Math.ceil(d*2.5);pop(q.x,q.y-42,'💥 ¡CRÍTICO!');}
  g.hp-=d;g.state='hurt';g.hurtT=.18;pop(q.x,q.y,['¡POW!','¡BAM!','¡ZAS!'][Math.random()*3|0]);
  if(applySpecial){
    if(weapon.fx==='thorn'){g.bleed=Math.max(g.bleed||0,1.8);g.bleedTick=.2;pop(q.x,q.y-20,'🩸 ¡ESPINAS!');}
    if(weapon.fx==='fire'){g.burn=Math.max(g.burn||0,2.4);g.burnTick=.15;pop(q.x,q.y-20,'🔥 ¡EN LLAMAS!');}
    if(weapon.fx==='poison'){g.poison=Math.max(g.poison||0,3.2);g.poisonTick=.35;pop(q.x,q.y-20,'☠️ ¡VENENO!');}
    if(weapon.fx==='ice'){g.freeze=Math.max(g.freeze||0,1.45);pop(q.x,q.y-20,'❄️ ¡CONGELADO!');}
    if(weapon.fx==='electric'){
      let chained=0;
      for(const other of gs){
        if(other===g||other.dead||other.state==='defeated'||chained>=3)continue;
        const z=P(other);
        if(Math.hypot(z.x-q.x,z.y-q.y)<145){hit(other,2,wi,false);pop((q.x+z.x)/2,(q.y+z.y)/2,'⚡');chained++;}
      }
    }
    if(weapon.fx==='storm'){
      let c=0;
      for(const o of gs){
        if(o===g||o.dead||o.state==='defeated'||c>=6)continue;
        const z=P(o);
        if(Math.hypot(z.x-q.x,z.y-q.y)<190){hit(o,3,wi,false);pop(z.x,z.y-10,'⚡');c++;}
      }
    }
    if(weapon.fx==='void'){
      pop(q.x,q.y-20,'🌀 ¡ATRAÍDO!');
      for(const o of gs){
        if(o.dead||o.state==='defeated'||o.state==='attack')continue;
        const z=P(o);
        if(Math.hypot(z.x-q.x,z.y-q.y)<170)o.p=Math.max(0,o.p-.07);
      }
    }
    if(weapon.fx==='nuke'){g.poison=Math.max(g.poison||0,4);g.poisonTick=.3;pop(q.x,q.y-20,'☢️');}
    if(weapon.fx==='pinata'){
      pop(q.x,q.y-28,'🎉 ¡PIÑATA!');
      let splinters=0;
      for(const other of gs){
        if(other===g||other.dead||other.state==='defeated'||splinters>=6)continue;
        const z=P(other);
        if(Math.hypot(z.x-q.x,z.y-q.y)<150){hit(other,1,wi,false);pop(z.x,z.y-18,'🍌');splinters++;}
      }
    }
  }
  defeat(g,q);
}
function th(tx,ty){
  if(bm.length||st!='play')return;
  ty=Math.min(ty,600);
  const x0=240,y0=730;let ux=tx-x0,uy=ty-y0;
  const l=Math.hypot(ux,uy)||1,L=Math.max(170,l);
  ux/=l;uy/=l;
  throwDirX=ux;throwDirY=uy;throwAnimT=0.34;
  const wi=S.ws,n=WP[wi].m+S.u.x;
  for(let i=0;i<n;i++){
    const o=n==1?0:(i-(n-1)/2)*Math.min(WP[wi].f||.3,1.3/Math.max(1,n-1));
    const c=Math.cos(o),s=Math.sin(o);
    bm.push({x0,y0,ux:ux*c-uy*s,uy:ux*s+uy*c,a:L/2,b:L*.3,t:0,dur:1.15/spd(),h:new Map(),x:x0,y:y0,w:wi,ex:false,specialUsed:false});
  }
}
function useSpecial(){
  if(st!=='play')return;
  const power=POWERUPS[S.ws];
  if(!power){pop(240,145,'¡EQUIPA CLÁSICA, PIÑATA O COLOSAL!');return;}
  const targets=gs.filter(g=>!g.dead&&g.state!=='defeated'&&g.hp>0);
  if(!targets.length){pop(240,145,'¡ESPERA A LOS GORILAS!');return;}
  if(S.b<power.cost){pop(240,145,'¡FALTAN '+(power.cost-S.b)+' BANANAS!');return;}
  S.b-=power.cost;
  const closest=[...targets].sort((a,b)=>b.p-a.p)[0],cq=P(closest);
  if(S.ws===0){
    hit(closest,5,0,false);powerFX.push({kind:'classic',t:0,x:240,y:700,tx:cq.x,ty:cq.y});pop(cq.x,cq.y-55,'🍌 ¡BANANA COLOSAL!');
  }else if(S.ws===6){
    const cx=cq.x,cy=cq.y;let count=0;
    for(const g of targets){const q=P(g);if(Math.hypot(q.x-cx,q.y-cy)<255&&count<14){hit(g,3,6,false);count++;}}
    powerFX.push({kind:'pinata',t:0,x:240,y:700,tx:cx,ty:cy});pop(cx,cy-60,'🎉 ¡PIÑATA VOLADORA!');
  }else if(S.ws===14){
    for(const g of targets)hit(g,30,14,false);
    powerFX.push({kind:'nova',t:0,x:240,y:390,tx:240,ty:390});shk=.75;pop(240,330,'☄️ ¡AGUACERO TITÁNICO!');
  }
  sv();
}

function up(dt){
  sp-=dt;
  if(left>0&&sp<=0){
    const key=boss?(boss===2?(boss=0,WORLD_BOSSES[currentWorld]):(boss=0,KINGS[currentWorld])):pick();
    mk(key);left--;sp=Math.max(.55,1.5-wave*.07);
  }
  for(const g of gs){
    if(g.state==='defeated'){g.fade-=dt;if(g.fade<=0)g.dead=1;continue;}
    if(g.hurtT>0){g.hurtT-=dt;if(g.hurtT<=0)g.state='walk';}
    for(const [key,step,label] of [['bleed',.42,'🩸'],['burn',.32,'🔥'],['poison',.58,'☠️']]){
      if(g[key]>0){
        g[key]=Math.max(0,g[key]-dt);g[key+'Tick']=(g[key+'Tick']||0)-dt;
        if(g[key+'Tick']<=0){g[key+'Tick']=step;g.hp-=1;pop(P(g).x,P(g).y-22,label);if(g.hp<=0)defeat(g);}
      }
    }
    if(g.state==='defeated')continue;
    const Q=GT[g.k];
    let v=Q.v*(1+wave*.02)*WORLDS[currentWorld].sp;
    if(g.freeze>0){g.freeze=Math.max(0,g.freeze-dt);v*=.12;}
    if(g.k=='s'){g.j-=dt;if(g.j<0&&g.a<=0){g.a=.4;g.j=1.5+Math.random()*1.5;}if(g.a>0){g.a-=dt;v*=5;}}
    if(g.k=='k'){g.sm-=dt;if(g.sm<0){g.sm=4;mk('n',g.p,g.lx-.3);mk('r',g.p,g.lx+.3);}}
    if(g.k==='m'){g.sm-=dt;if(g.sm<0){g.sm=5.5;mk('n',Math.max(0,g.p-.12),g.lx-.22);pop(P(g).x,P(g).y-34,'✨ ¡INVOCACIÓN!');}}
    if(g.k==='i'){g.j-=dt;if(g.j<0){g.j=1.7;g.a=.28;}if(g.a>0){g.a-=dt;v*=3.2;}}
    if(g.k==='b'&&g.hp<g.mh*.5)v*=1.55;
    if(g.k==='j'&&g.p>.55)v*=1.55;
    if(g.k==='y'){g.j-=dt;if(g.j<0&&g.a<=0){g.a=.42;g.j=1.7;}if(g.a>0){g.a-=dt;v*=4.5;}}
    if(g.k==='u'){g.phaseT-=dt;if(g.phaseT<=0){g.phaseT=2.2;g.p=Math.min(.9,g.p+.12);g.lx=Math.max(-.85,Math.min(.85,g.lx+(Math.random()-.5)*.5));pop(P(g).x,P(g).y-24,'🛸 ¡SALTO!');}}
    if(g.k==='o'){g.phaseT-=dt;if(g.phaseT<=0){g.phaseT=2.1;g.dodge=.75;}if(g.dodge>0)g.dodge=Math.max(0,g.dodge-dt);}
    if(Q.sm){g.sm-=dt;if(g.sm<0){g.sm=Q.si||5;mk(Q.sm,Math.max(0,g.p-.08),Math.max(-.8,Math.min(.8,g.lx+(Math.random()-.5)*.45)));pop(P(g).x,P(g).y-34,'👑 ¡REFUERZOS!');}}
    if(Q.tp){g.phaseT-=dt;if(g.phaseT<=0){g.phaseT=2.4;g.p=Math.min(.9,g.p+.1);g.lx=Math.max(-.85,Math.min(.85,g.lx+(Math.random()-.5)*.55));pop(P(g).x,P(g).y-24,'🌀 ¡PORTAL!');}}
    if(Q.en&&g.hp<g.mh*.5)v*=1.45;
    if(Q.ds){g.j-=dt;if(g.j<0){g.j=Q.ds;g.a=.3;}if(g.a>0){g.a-=dt;v*=3;}}
    if(Q.rg&&g.hp<g.mh){g.rgT=(g.rgT||Q.rg)-dt;if(g.rgT<=0){g.rgT=Q.rg;g.hp=Math.min(g.mh,g.hp+1);pop(P(g).x,P(g).y-24,'💚 +1');}}

    const stop=(bh>0&&!GT[g.k].bs)?.78:1;
    if(g.p>=stop){
      g.p=stop;g.state='attack';g.anim+=dt*13;g.attackT-=dt;
      if(g.attackT<=0){
        g.attackT=stop<1?.68:.82;shk=.35;
        if(stop<1){bh--;pop(240,635,'¡CRAC!');if(bh<=0)deployBarricade();}
        else{
          lives--;pop(240,700,'-1 ❤️');
          if(lives<=0){
            S.best=Math.max(S.best,wave);st='over';S.run=null;S.shop=null;sv();ui();return;
          }
        }
      }
    }else{
      if(g.state!=='hurt')g.state='walk';
      g.p+=v*dt;g.anim+=dt*(8+v*45);
    }
  }
  gs=gs.filter(g=>!g.dead);

  for(const b of bm){
    b.t+=dt;const u=Math.min(1,b.t/b.dur),th=2*Math.PI*u,px=-b.uy,py=b.ux;
    b.x=b.x0+b.ux*b.a*(1-Math.cos(th))+px*b.b*Math.sin(th);
    b.y=b.y0+b.uy*b.a*(1-Math.cos(th))+py*b.b*Math.sin(th);
    if(WP[b.w].x&&u>=.5&&!b.ex){
      b.ex=1;const R=(WP[b.w].r||130)*siz();shk=.4;pop(b.x,b.y,'💥 ¡BOOM!');
      for(const g of gs){
        if(g.dead||g.state==='defeated')continue;
        if(Math.hypot(P(g).x-b.x,P(g).y-b.y)<R)hit(g,dmg()+(WP[b.w].xd||0),b.w,true,true);
      }
    }
    const seg=u<.5?0:1;
    for(const g of gs){
      if(g.dead||g.state==='defeated'||b.h.get(g)===seg)continue;
      const q=P(g);
      if(Math.hypot(q.x-b.x,q.y-b.y)<GT[g.k].r*q.s+24*siz()){
        b.h.set(g,seg);hit(g,dmg(),b.w,true,true);
      }
    }
  }
  bm=bm.filter(b=>b.t<b.dur);
  if(left<=0&&!gs.length&&!bm.length){
    S.best=Math.max(S.best,wave);
    if(S.u.h>0&&lives<mx()){const heal=Math.min(mx()-lives,S.u.h);lives+=heal;pop(240,120,'+'+heal+' ❤️');}
    st='shop';PAGE='shop';T='u';sv();ui();
  }
}

function drawAvatar(cx,cy,scale=1,swing=0){
  const hat=avatarWear('sombreros'),hair=avatarWear('cabello'),shirt=avatarWear('camisas');
  const pants=avatarWear('pantalones'),shoes=avatarWear('zapatos'),acc=avatarWear('accesorios'),bag=avatarWear('mochilas');
  const dur=0.34;
  const isThrowing=throwAnimT>0;
  const p=isThrowing?Math.min(1,Math.max(0,(dur-throwAnimT)/dur)):0;
  const thrust=isThrowing?Math.sin(p*Math.PI):0;
  const armPitch=0.15-thrust*1.15;

function dr(){

  }
  for(const g of[...gs].sort((a,b)=>a.p-b.p))dg(g);
  for(const b of bm){
    const s=SK[S.ks];x.save();x.translate(b.x,b.y);x.rotate(tm*16);x.scale(siz(),siz());
    const c=WP[b.w].c||(s[1]=='R'?'hsl('+(tm*360%360)+',95%,60%)':s[1]);
    x.beginPath();x.moveTo(-20,-8);x.quadraticCurveTo(0,22,22,-10);x.quadraticCurveTo(2,8,-20,-8);
    x.fillStyle=c;x.fill();x.lineWidth=3;x.strokeStyle='#2b1b0e';x.stroke();x.restore();
  }

  for(const p of powerFX){
    const k=Math.max(0,1-p.t/.85);x.save();x.globalAlpha=k;
    x.strokeStyle=p.kind==='nova'?'#ffd93b':(p.kind==='pinata'?'#ff7eb6':'#ffe55c');
    x.lineWidth=10*k;x.beginPath();x.arc(p.tx,p.ty,(1-k)*190+24,0,7);x.stroke();x.restore();
  }
  const swing=throwAnimT>0?Math.sin(throwAnimT*9)*0.3:Math.sin(tm*2.8)*0.08;
  drawAvatar(240,758,1.18,swing);
  if(st!='menu'){

      x.strokeStyle='#2b1b0e';x.lineWidth=3;

  let itemsHtml='';
  if(T==='u'){
    itemsHtml=`<div class="it barItem">
      <div><b>🛡️ Barricada Portátil</b> (${S.bar}/5)<small>Bloquea a los gorilas normales al iniciar oleada (aguanta ${bhMax()} golpes).</small></div>
      <button ${S.b<40||S.bar>=5?'disabled':''} onclick="userTouched=true;S.b-=40;S.bar++;sv(true);ui()">${S.bar>=5?'MÁX':'40 🍌'}</button>
    </div>`+
    UP.map(([k,n,d,,m])=>{
      const l=S.u[k],c=cost(k);
      return `<div class="it">
        <div><b>${n}</b> (${l}/${m})<small>${d}</small></div>
        <button ${l>=m||S.b<c?'disabled':''} onclick="userTouched=true;S.b-=${c};S.u.${k}++;${k=='l'?'lives++;':''}sv(true);ui()">${l>=m?'MÁX':c+' 🍌'}</button>
      </div>`;
    }).join('');
  }else if(T==='w'){
    itemsHtml=WP.map((w,i)=>{
      const o=S.w.includes(i),e=S.ws==i;
      return `<div class="it">
        <div><b>${w.n}</b> <span class="tag" style="font-size:.7em">${w.cat}</span><small>${w.t} (Daño ${w.d} • Tiros ${w.m})</small></div>
        <button class="${e?'on':''}" ${!o&&S.b<w.p?'disabled':''} onclick="userTouched=true;if(!${o}){S.b-=${w.p};S.w.push(${i})}S.ws=${i};sv(true);ui()">${e?'EQUIPADA':o?'USAR':w.p+' 🍌'}</button>
      </div>`;
    }).join('');
  }else if(T==='k'){
    itemsHtml=SK.map((s,i)=>{
      const o=S.k.includes(i),e=S.ks==i;
      return `<div class="it">
        <div><span class="sw" style="background:${s[1]=='R'?'linear-gradient(90deg,red,orange,yellow,green,cyan,blue,violet)':s[1]}"></span><b>${s[0]}</b><small>${s[4]}</small></div>
        <button class="${e?'on':''}" ${!o&&S.b<s[3]?'disabled':''} onclick="userTouched=true;if(!${o}){S.b-=${s[3]};S.k.push(${i})}S.ks=${i};sv(true);ui()">${e?'EQUIPADO':o?'USAR':s[3]+' 🍌'}</button>
      </div>`;
    }).join('');
  }else if(T==='a'){
    const cat=AVATAR_CATEGORIES.find(c=>c.key===AVATAR_TAB)||AVATAR_CATEGORIES[0];
    itemsHtml=`<div class="avTabs">${AVATAR_CATEGORIES.map(c=>
      `<button class="${AVATAR_TAB===c.key?'on':''}" onclick="AVATAR_TAB='${c.key}';ui()">${c.label}</button>`
    ).join('')}</div>`+
    AVATAR_ITEMS.filter(it=>it.category===cat.key).map(it=>{
      const owned=S.avatar.owned.includes(it.id),eq=S.avatar.equip[cat.key]===it.id;
      const canUnequip=eq&&!AVATAR_START.includes(it.id);
      return `<div class="it avItem">
        <div><span class="sw" style="background:${it.color}"></span><b>${it.name}</b><small><span class="rarity" style="color:${it.rarityColor}">${it.rarity}</span> • ${cat.label}</small></div>
        <button class="${eq?'on':''}" ${!owned&&S.b<it.price?'disabled':''} onclick="buyOrEquipAvatar('${it.id}')">${canUnequip?'QUITAR':eq?'PUESTO':owned?'USAR':it.price+' 🍌'}</button>
      </div>`;
    }).join('');
  }

  return `
    ${headerBar}
    <div class="tb">
      <button class="${T=='u'?'on':''}" onclick="T='u';ui()">⚡ Mejoras</button>
      <button class="${T=='w'?'on':''}" onclick="T='w';ui()">🍌 Armas</button>
      <button class="${T=='k'?'on':''}" onclick="T='k';ui()">🎨 Aspectos</button>
      <button class="${T=='a'?'on':''}" onclick="T='a';ui()">🧢 Avatar</button>
    </div>
    ${st==='shop'?`<button class="go" onclick="userTouched=true;S.shop=null;nw();st='play';sv();ui()">▶ OLEADA ${wave+1}</button>`:''}
    ${itemsHtml}
    ${st==='shop'?`<button class="go" onclick="userTouched=true;S.shop=null;nw();st='play';sv();ui()">▶ CONTINUAR OLEADA ${wave+1}</button>`:''}
  `;
}

function ui(){
  U.style.display=st=='play'?'none':'block';
  if(st=='play')return;

  if(st==='over'){
    U.innerHTML=`
      <div class="heroBanner" style="background:linear-gradient(135deg,#ff7657,#ffb84d)">
        <div class="badge">FIN DE LA EXPEDICIÓN</div>
        <h1>¡DEFENSA SUPERADA!</h1>
        <p style="font-weight:800">Los gorilas alcanzaron el campamento en la oleada ${wave}.</p>
      </div>
      <div class="statGrid">
        <div class="statBox"><strong>🌊 ${wave}</strong><span>Oleada</span></div>
        <div class="statBox"><strong>🏆 ${S.best}</strong><span>Récord</span></div>
        <div class="statBox"><strong>🍌 ${S.b}</strong><span>Bananas</span></div>
      </div>
      <button class="go" onclick="start()">🔄 INTENTAR DE NUEVO</button>
      <button style="width:100%;margin-top:6px" onclick="st='menu';PAGE='shop';ui()">🛒 Ir a Mejoras y Armería</button>
      <button style="width:100%;margin-top:6px;background:#fff3c4" onclick="st='menu';PAGE='home';ui()">🏠 Volver al Inicio</button>
    `;
    return;
  }

  let pageBody='';
  if(PAGE==='home')pageBody=renderHomePage();
  else if(PAGE==='guide')pageBody=renderGuidePage();
  else if(PAGE==='news')pageBody=renderNewsPage();
  else if(PAGE==='shop')pageBody=renderShopContent();
  else if(PAGE==='legal')pageBody=renderLegalPage();
  else if(PAGE==='contact')pageBody=renderContactPage();

  U.innerHTML=renderTopNav()+pageBody;
}

function buyOrEquipAvatar(id){
  userTouched=true;const it=AVATAR_BY_ID[id];if(!it)return;
  if(!S.avatar.owned.includes(id)){
    if(S.b<it.price)return;
    S.b-=it.price;S.avatar.owned.push(id);
  }
  const cat=it.category;
  if(S.avatar.equip[cat]===id&&!AVATAR_START.includes(id))S.avatar.equip[cat]=null;
  else S.avatar.equip[cat]=id;
  sv(true);ui();
}

function exportSave(){
  userTouched=true;sv();
  const payload=JSON.stringify({version:SAVE_VERSION,exportedAt:new Date().toISOString(),data:S},null,2);
  const blob=new Blob([payload],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='banana-throw-progreso.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast('Progreso exportado correctamente');
}

function toggleTheme(){
  const root=document.documentElement;
  const cur=root.getAttribute('data-theme');
  root.setAttribute('data-theme',cur==='dark'?'light':'dark');
}

document.getElementById('saveFile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    const text=await file.text(),decoded=decodeSave(text);
    if(!decoded)throw new Error('Archivo inválido');
    userTouched=true;S=decoded.data;sv();restoreRun();ui();
    showToast('Progreso restaurado con éxito');
  }catch(err){showToast('El archivo JSON no es válido');}
  e.target.value='';
});

window.addEventListener('beforeunload',()=>sv());
window.addEventListener('pagehide',()=>sv());
window.addEventListener('blur',()=>sv());
document.addEventListener('visibilitychange',()=>{if(document.hidden)sv();});
setInterval(()=>sv(),1000);
recoverIndexedDB();ui();

let lt=performance.now();
function lp(t){
  DT=Math.min(.05,(t-lt)/1000);lt=t;tm+=DT;
  if(throwAnimT>0)throwAnimT=Math.max(0,throwAnimT-DT);
  if(shk>0)shk=Math.max(0,shk-DT*2);
  for(const f of fx)f.t+=DT*1.3;fx=fx.filter(f=>f.t<1);
  for(const p of powerFX)p.t+=DT;powerFX=powerFX.filter(p=>p.t<.85);
  if(st=='play'){
    up(DT);saveClock+=DT;
    if(saveClock>=0.8){saveClock=0;sv();}
  }
  dr();requestAnimationFrame(lp);
}
requestAnimationFrame(lp);
</script>
</body>
</html>
